# Uso (desde la raíz del repositorio):
#   cp .env.example .env        # y completa los valores
#   docker compose --env-file .env -f docker/docker-compose.yml up --build
#
# Solo la base de datos (para desarrollar con 'dotnet run'):
#   docker compose --env-file .env -f docker/docker-compose.yml up db -d

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartstock-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Define DB_SA_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:1433:1433"   # solo accesible desde tu propia máquina
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # $$ evita que compose interprete la variable; la lee el shell del contenedor.
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartstock-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=SmartStockAI;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      AI__Provider: ${AI_PROVIDER:-OpenAI}
      AI__Model: ${AI_MODEL:-}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Endpoint: ${AI_ENDPOINT:-}
      AI__ApiVersion: ${AI_API_VERSION:-}
      # Recuperación de contraseña
      Auth__MostrarEnlaceRecuperacion: ${AUTH_MOSTRAR_ENLACE_RECUPERACION:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__EnableSsl: ${EMAIL_ENABLE_SSL:-true}
    restart: unless-stopped

volumes:
  sqldata:
